<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>安心血壓紀錄</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#182230;--muted:#667085;--line:#e4e7ec;--primary:#2563eb;--ok:#16803a;--warn:#b54708;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}
.container{max-width:920px;margin:auto;padding:22px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:18px}.hero h1{margin:0;font-size:clamp(28px,5vw,42px)}.hero p{color:var(--muted);margin:8px 0 0}.badge{background:#e8efff;color:#1849a9;padding:10px 14px;border-radius:999px;font-weight:700;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 5px 18px rgba(16,24,40,.05)}h2{font-size:19px;margin:0 0 14px}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #d0d5dd;border-radius:11px;padding:12px;font-size:16px;background:#fff}.field textarea{min-height:80px;resize:vertical}.full{grid-column:1/-1}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:11px;padding:11px 15px;font-size:15px;font-weight:700;cursor:pointer}.primary{background:var(--primary);color:#fff}.secondary{background:#eef2f6;color:#344054}.dangerBtn{background:#fee4e2;color:#b42318}
.result{min-height:170px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border-radius:14px;background:#f8fafc;padding:18px}.reading{font-size:38px;font-weight:800}.unit{font-size:14px;color:var(--muted)}.status{font-size:22px;font-weight:800;margin-top:8px}.advice{margin-top:8px;color:var(--muted);line-height:1.6}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.stat{background:#f8fafc;border-radius:12px;padding:12px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}
.history{grid-column:1/-1}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:670px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--muted);font-weight:600}.tag{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700}.normal{background:#dcfae6;color:#067647}.elevated{background:#fef0c7;color:#93370d}.stage1{background:#ffead5;color:#b54708}.stage2,.crisis{background:#fee4e2;color:#b42318}
.notice{font-size:13px;color:var(--muted);line-height:1.6;margin-top:14px}.empty{text-align:center;color:var(--muted);padding:24px}.footer{text-align:center;color:var(--muted);font-size:12px;margin:18px 0}
@media(max-width:720px){.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.hero{align-items:flex-start;flex-direction:column}.badge{white-space:normal}.history{grid-column:auto}}
</style>
</head>
<body>
<div class="container">
  <header class="hero"><div><h1>安心血壓紀錄</h1><p>記錄血壓、脈搏、體重與量測時間，觀察長期趨勢。</p></div><div class="badge">資料只儲存在此裝置</div></header>
  <main class="grid">
    <section class="card">
      <h2>新增量測</h2>
      <form id="bpForm">
        <div class="fields">
          <div class="field"><label for="sys">收縮壓 SYS</label><input id="sys" type="number" min="50" max="260" required placeholder="120"></div>
          <div class="field"><label for="dia">舒張壓 DIA</label><input id="dia" type="number" min="30" max="180" required placeholder="80"></div>
          <div class="field"><label for="pulse">脈搏 / 分</label><input id="pulse" type="number" min="30" max="220" required placeholder="72"></div>
          <div class="field"><label for="weight">體重 kg</label><input id="weight" type="number" min="20" max="300" step="0.1" required placeholder="65.0"></div>
          <div class="field"><label for="date">日期時間</label><input id="date" type="datetime-local" required></div>
          <div class="field"><label for="arm">量測手臂</label><select id="arm"><option>左手</option><option>右手</option></select></div>
          <div class="field"><label for="posture">姿勢</label><select id="posture"><option>坐姿</option><option>躺姿</option><option>站姿</option></select></div>
          <div class="field full"><label for="note">備註</label><textarea id="note" placeholder="例如：早餐前、運動後、服藥前"></textarea></div>
        </div>
        <div class="actions"><button class="primary" type="submit">儲存紀錄</button><button class="secondary" type="button" id="demo">填入範例</button></div>
      </form>
      <div class="notice">量測前建議安靜休息，手臂平放並使用合適尺寸的上臂式血壓計。此程式本身無法取代經認證的血壓計。</div>
    </section>

    <section class="card">
      <h2>本次結果</h2>
      <div id="result" class="result"><div class="status">尚未輸入</div><div class="advice">儲存一筆資料後，這裡會顯示判讀結果。</div></div>
      <div class="stats">
        <div class="stat"><b id="avgSys">—</b><span>平均收縮壓</span></div>
        <div class="stat"><b id="avgDia">—</b><span>平均舒張壓</span></div>
        <div class="stat"><b id="avgWeight">—</b><span>平均體重 kg</span></div>
        <div class="stat"><b id="count">0</b><span>紀錄筆數</span></div>
      </div>
    </section>

    <section class="card history">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><h2>歷史紀錄</h2><div class="actions" style="margin:0"><button id="export" class="secondary">匯出 CSV</button><button id="clear" class="dangerBtn">清除全部</button></div></div>
      <div class="table-wrap"><table><thead><tr><th>時間</th><th>血壓</th><th>脈搏</th><th>體重</th><th>分類</th><th>狀態</th><th>備註</th><th></th></tr></thead><tbody id="historyBody"></tbody></table></div>
    </section>
  </main>
  <div class="footer">僅供健康紀錄與趨勢觀察，不提供診斷。數值異常或身體不適時，請由家長／監護人協助聯絡醫療專業人員。</div>
</div>
<script>
const KEY='bp_records_v1';
let records=JSON.parse(localStorage.getItem(KEY)||'[]');
const $=id=>document.getElementById(id);
function localDateValue(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
$('date').value=localDateValue();
function classify(s,d){
  if(s>180||d>120)return {name:'血壓嚴重偏高',cls:'crisis',advice:'請先安靜休息後再次量測；若仍非常高，請立即告知家長或監護人並聯絡醫療專業人員。若同時有明顯不適，請尋求緊急協助。'};
  if(s>=140||d>=90)return {name:'高血壓第 2 期範圍',cls:'stage2',advice:'單次讀值不能確診，建議持續記錄並安排醫療評估。'};
  if(s>=130||d>=80)return {name:'高血壓第 1 期範圍',cls:'stage1',advice:'建議在不同日期重複量測並與醫療專業人員討論。'};
  if(s>=120&&d<80)return {name:'血壓偏高',cls:'elevated',advice:'留意作息、飲食與運動，並持續追蹤趨勢。'};
  return {name:'正常範圍',cls:'normal',advice:'維持規律量測與健康生活習慣。'};
}
function save(){localStorage.setItem(KEY,JSON.stringify(records))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderResult(r){if(!r)return;const c=classify(r.sys,r.dia);$('result').innerHTML=`<div class="reading">${r.sys}/${r.dia} <span class="unit">mmHg</span></div><div class="status">${c.name}</div><div class="advice">脈搏 ${r.pulse}/分${r.weight ? `，體重 ${Number(r.weight).toFixed(1)} kg` : ''}。${c.advice}</div>`}
function render(){
 $('count').textContent=records.length;
 if(records.length){$('avgSys').textContent=Math.round(records.reduce((a,r)=>a+r.sys,0)/records.length);$('avgDia').textContent=Math.round(records.reduce((a,r)=>a+r.dia,0)/records.length);const wr=records.filter(r=>Number(r.weight)>0);$('avgWeight').textContent=wr.length?(wr.reduce((a,r)=>a+Number(r.weight),0)/wr.length).toFixed(1):'—';renderResult(records[0])}else{$('avgSys').textContent='—';$('avgDia').textContent='—';$('avgWeight').textContent='—';$('result').innerHTML='<div class="status">尚未輸入</div><div class="advice">儲存一筆資料後，這裡會顯示判讀結果。</div>'}
 const body=$('historyBody');
 if(!records.length){body.innerHTML='<tr><td colspan="8" class="empty">目前沒有紀錄</td></tr>';return}
 body.innerHTML=records.map((r,i)=>{const c=classify(r.sys,r.dia);return `<tr><td>${new Date(r.date).toLocaleString('zh-TW')}</td><td><b>${r.sys}/${r.dia}</b> mmHg</td><td>${r.pulse}/分</td><td>${r.weight ? Number(r.weight).toFixed(1)+' kg' : '—'}</td><td><span class="tag ${c.cls}">${c.name}</span></td><td>${esc(r.arm)}・${esc(r.posture)}</td><td>${esc(r.note)||'—'}</td><td><button class="secondary" onclick="removeRecord(${i})">刪除</button></td></tr>`}).join('')
}
window.removeRecord=i=>{records.splice(i,1);save();render()}
$('bpForm').addEventListener('submit',e=>{e.preventDefault();const sys=+$('sys').value,dia=+$('dia').value,pulse=+$('pulse').value,weight=+$('weight').value;if(dia>=sys){alert('舒張壓通常應低於收縮壓，請確認輸入值。');return}records.unshift({sys,dia,pulse,weight,date:$('date').value,arm:$('arm').value,posture:$('posture').value,note:$('note').value.trim()});save();render();e.target.reset();$('date').value=localDateValue()});
$('demo').onclick=()=>{$('sys').value=128;$('dia').value=78;$('pulse').value=72;$('weight').value=65.0;$('note').value='晚餐前'};
$('clear').onclick=()=>{if(confirm('確定清除所有紀錄？此動作無法復原。')){records=[];save();render()}};
$('export').onclick=()=>{if(!records.length){alert('目前沒有可匯出的紀錄。');return}const rows=[['時間','收縮壓','舒張壓','脈搏','體重(kg)','分類','手臂','姿勢','備註'],...records.map(r=>[r.date,r.sys,r.dia,r.pulse,r.weight??'',classify(r.sys,r.dia).name,r.arm,r.posture,r.note])];const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='血壓紀錄.csv';a.click();URL.revokeObjectURL(a.href)};
render();
</script>
</body>
</html>
